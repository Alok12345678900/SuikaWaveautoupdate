name: Build Release APK
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

# Wajib: biar workflow boleh bikin tag + GitHub Release
permissions:
  contents: write

# Jangan cancel build yang lagi jalan, antri aja supaya nomor tag tidak bentrok
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Hitung versi berikutnya dari tag yang sudah ada: v1.0 -> v2.0 -> v3.0 ...
      - name: Calculate next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch --tags --force
          LAST=$(git tag -l 'v[0-9]*.0' | sed -E 's/^v([0-9]+)\.0$/\1/' | sort -n | tail -1)
          # cek juga release di GitHub (jaga-jaga tag-nya kehapus tapi release masih ada)
          LAST_REL=$(gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null \
            | grep -E '^v[0-9]+\.0$' | sed -E 's/^v([0-9]+)\.0$/\1/' | sort -n | tail -1 || true)
          LAST=$(printf '%s\n%s\n' "${LAST:-0}" "${LAST_REL:-0}" | sort -n | tail -1)
          NEXT=$((LAST + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}.0" >> "$GITHUB_OUTPUT"
          echo "name=${NEXT}.0" >> "$GITHUB_OUTPUT"
          # versionCode harus selalu naik (build lama pakai 153), jadi dikasih offset
          echo "code=$((NEXT + 1000))" >> "$GITHUB_OUTPUT"
          echo "Versi berikutnya: v${NEXT}.0"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Bersihin file lama yang bisa nyangkut di repo (bikin "Duplicate resources")
      - name: Remove stale duplicate resources
        run: |
          cd app/src/main/res/drawable
          rm -f ic_launcher_foreground.png ic_launcher_foreground_v31.png ic_launcher_monochrome.png app_logo.png
          ls | grep -E "launcher|app_logo" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (GMS / full)
        run: ./gradlew --console=plain assembleGmsRelease --build-cache --warning-mode summary
        env:
          SUIKAAWAVE_APPLICATION_ID: com.suikaawave.music
          SUIKAAWAVE_APP_NAME: SuikaaWave
          # versi APK = tag release, repo updater = repo tempat build ini jalan
          SUIKAAWAVE_VERSION_NAME: ${{ steps.ver.outputs.name }}
          SUIKAAWAVE_VERSION_CODE: ${{ steps.ver.outputs.code }}
          SUIKAAWAVE_UPDATE_REPO: ${{ github.repository }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # Signing: pakai keystore dari secrets kalau ada, kalau tidak pakai
      # keystore tetap di .github/keystore/release.jks. Keystore HARUS tetap
      # sama tiap build, kalau berganti APK baru gagal di-install sebagai update.
      - name: Sign APK
        run: |
          set -e
          OUT=app/build/outputs/apk/gms/release
          APK=$(ls $OUT/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > release.jks
            ALIAS="${{ secrets.KEY_ALIAS }}"
            SPASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KPASS="${{ secrets.KEY_PASSWORD }}"
          else
            cp .github/keystore/release.jks release.jks
            ALIAS=suikaawave; SPASS=suikaawave; KPASS=suikaawave
          fi
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$SPASS" --key-pass pass:"$KPASS" \
            --out SuikaaWave.apk aligned.apk
          $BT/apksigner verify SuikaaWave.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SuikaaWave
          path: SuikaaWave.apk

      # Auto publish GitHub Release dengan tag baru
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" SuikaaWave.apk \
            --target "${{ github.sha }}" \
            --title "${{ steps.ver.outputs.name }}" \
            --generate-notes \
            --latest
